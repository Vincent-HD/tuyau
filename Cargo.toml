[workspace]
members = ["crates/*"]
default-members = ["crates/tuyau"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.95"

[workspace.dependencies]
tuyau-core = { path = "crates/tuyau-core" }
tuyau-pipewire = { path = "crates/tuyau-pipewire" }
tuyau-gui = { path = "crates/tuyau-gui" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
globset = "0.4"
clap = { version = "4.6", features = ["derive"] }
pipewire = "0.10"
async-channel = "2"
dirs = "6"
log = "0.4"
env_logger = "0.11"
gpui = { git = "https://github.com/gpui-ce/gpui-ce", rev = "1fe3d947698287f3ba50ef074a3eadd1ad46b84c", package = "gpui-ce" }
gpui_platform = { git = "https://github.com/gpui-ce/gpui-ce", rev = "1fe3d947698287f3ba50ef074a3eadd1ad46b84c", package = "gpui_ce_platform", features = ["wayland", "x11"] }

[profile.release]
lto = "thin"
strip = true

# Dev runs stay fast to rebuild while GPUI and its dependencies run optimized.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
