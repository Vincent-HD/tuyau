name: Release

on:
  push:
    branches: [main]
  # Builds the binaries as workflow artifacts, without releasing anything.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please bumps Cargo.toml only; the flake builds with the lock
      # file, so the workspace crates' versions there must follow.
      - if: ${{ steps.release.outputs.pr }}
        uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
      - if: ${{ steps.release.outputs.pr }}
        name: Sync Cargo.lock
        run: |
          version=$(jq -r '."."' .release-please-manifest.json)
          awk -v version="$version" '
            /^name = "tuyau(-core|-gui|-pipewire)?"$/ { print; getline; print "version = \"" version "\""; next }
            { print }
          ' Cargo.lock > Cargo.lock.new
          mv Cargo.lock.new Cargo.lock
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: sync Cargo.lock with the release version"
            git push
          fi

  binaries:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created || github.event_name == 'workflow_dispatch' }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.sha }}
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config clang libclang-dev \
            libpipewire-0.3-dev libspa-0.2-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libx11-xcb-dev \
            libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libxcb-xinput-dev \
            libegl1-mesa-dev libgles2-mesa-dev libvulkan-dev \
            libfontconfig-dev libfreetype-dev libasound2-dev libdrm-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
      - name: Build
        run: cargo build --release --locked -p tuyau
      - name: Package
        id: package
        run: |
          name="tuyau-${{ needs.release-please.outputs.version || 'dev' }}-${{ matrix.arch }}-linux"
          mkdir -p "$name"
          cp target/release/tuyau assets/tuyau.desktop README.md "$name/"
          cp assets/icon.svg "$name/tuyau.svg"
          tar czf "$name.tar.gz" "$name"
          echo "archive=$name.tar.gz" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}
          path: ${{ steps.package.outputs.archive }}
      - if: ${{ needs.release-please.outputs.release_created }}
        name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" "${{ steps.package.outputs.archive }}"

  # Pins the release archives in the flake, so `tuyau-bin` downloads them.
  pin-binaries:
    needs: [release-please, binaries]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: archives
      - name: Write nix/binaries.json
        run: |
          sri() { echo "sha256-$(openssl dgst -sha256 -binary "$1" | base64)"; }
          version="${{ needs.release-please.outputs.version }}"
          tag="${{ needs.release-please.outputs.tag_name }}"
          base="https://github.com/${{ github.repository }}/releases/download/$tag"
          jq -n \
            --arg version "$version" \
            --arg x86 "$base/tuyau-$version-x86_64-linux.tar.gz" \
            --arg x86Hash "$(sri archives/x86_64/*.tar.gz)" \
            --arg arm "$base/tuyau-$version-aarch64-linux.tar.gz" \
            --arg armHash "$(sri archives/aarch64/*.tar.gz)" \
            '{version: $version,
              "x86_64-linux": {url: $x86, hash: $x86Hash},
              "aarch64-linux": {url: $arm, hash: $armHash}}' > nix/binaries.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nix/binaries.json
          git commit -m "chore: pin the $tag binaries for tuyau-bin"
          git push
